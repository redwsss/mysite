<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MST Операция</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #16213e;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
        }
        .btn {
            background: #5865F2;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover {
            background: #4752c4;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 20px auto;
            display: none;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            background: #1a1a2e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card" id="content">
        <h1>🚔 MST Операция</h1>
        <p id="message">Проверка авторизации...</p>
        <div id="userInfo" style="display: none;">
            <img id="avatar" class="avatar" src="" alt="Avatar">
            <h2 id="username"></h2>
            <p id="userId"></p>
            
            <!-- Форма заявки -->
            <div id="applicationForm">
                <h3>📋 Подать заявку</h3>
                <input type="text" id="charName" placeholder="Имя персонажа">
                <input type="number" id="charAge" placeholder="Возраст">
                <select id="charRank">
                    <option value="Cadet">Кадет</option>
                    <option value="Officer">Офицер</option>
                    <option value="Sergeant">Сержант</option>
                    <option value="Lieutenant">Лейтенант</option>
                </select>
                <button class="btn" onclick="submitApplication()">Отправить заявку</button>
            </div>
        </div>
        <button id="loginBtn" class="btn" style="display: none;">Войти через Discord</button>
        <button id="logoutBtn" class="btn" style="display: none; background: #e74c3c;">Выйти</button>
    </div>

    <script>
        const CLIENT_ID = '1464524362005741720';
        const REDIRECT_URI = 'https://redwsss.github.io/mysite/';
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1541306556883406959/ZLvm0dNuev9wXpOJopO3uFlor65j9YwxKp-B97H3qHcrlq1fWE1ggV6pC8iJmpQyIMgR'; // Вставь свой

        let currentUser = null;

        // Проверка при загрузке
        window.onload = function() {
            if (window.location.hash) {
                const params = new URLSearchParams(window.location.hash.substring(1));
                const token = params.get('access_token');
                
                if (token) {
                    localStorage.setItem('discord_token', token);
                    window.location.hash = '';
                    loadUserData(token);
                }
            } else {
                const savedToken = localStorage.getItem('discord_token');
                if (savedToken) {
                    loadUserData(savedToken);
                } else {
                    showLogin();
                }
            }
        };

        function showLogin() {
            document.getElementById('message').textContent = 'Войдите через Discord';
            document.getElementById('loginBtn').style.display = 'block';
            document.getElementById('loginBtn').onclick = login;
        }

        function login() {
            const authUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = authUrl;
        }

        async function loadUserData(token) {
            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Invalid token');
                
                const user = await response.json();
                currentUser = user;
                
                document.getElementById('message').textContent = '✅ Авторизован!';
                document.getElementById('userInfo').style.display = 'block';
                document.getElementById('username').textContent = user.username;
                document.getElementById('userId').textContent = `ID: ${user.id}`;
                
                if (user.avatar) {
                    document.getElementById('avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`;
                    document.getElementById('avatar').style.display = 'block';
                }
                
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('logoutBtn').onclick = logout;
                
            } catch (error) {
                localStorage.removeItem('discord_token');
                showLogin();
            }
        }

        // Отправка заявки через вебхук
        async function submitApplication() {
            const charName = document.getElementById('charName').value;
            const charAge = document.getElementById('charAge').value;
            const charRank = document.getElementById('charRank').value;
            
            if (!charName || !charAge) {
                alert('Заполните все поля!');
                return;
            }
            
            const embed = {
                title: '📋 Новая заявка',
                color: 0x5865F2,
                fields: [
                    { name: 'Discord', value: currentUser.username, inline: true },
                    { name: 'ID', value: currentUser.id, inline: true },
                    { name: 'Персонаж', value: charName, inline: true },
                    { name: 'Возраст', value: charAge, inline: true },
                    { name: 'Ранг', value: charRank, inline: true }
                ],
                timestamp: new Date().toISOString()
            };
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [embed]
                    })
                });
                
                if (response.ok) {
                    alert('✅ Заявка отправлена!');
                    document.getElementById('charName').value = '';
                    document.getElementById('charAge').value = '';
                } else {
                    alert('❌ Ошибка отправки');
                }
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
            }
        }

        function logout() {
            localStorage.removeItem('discord_token');
            location.reload();
        }
    </script>
</body>
</html>
