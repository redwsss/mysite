<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя биография</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
        }
        /* Прозрачный размытый слой для лучшей читаемости */
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h2 {
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            color: #2980b9;
        }
        .avatar {
            display: block;
            margin: 0 auto 20px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        p, li {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Чтобы вставить свое фото, загрузите его в репозиторий с именем myavatar.jpg -->
    <img src="myavatar.jpg" class="avatar" alt="Моё фото">
    
    <h1>Ваше Имя</h1>
    <p style="text-align: center;">Ваш слоган или профессия</p>

    <h2>Обо мне</h2>
    <p>Напишите здесь немного о себе. Что вы любите, чем занимаетесь.</p>

    <h2>Мои достижения</h2>
    <ul>
        <li>Первое достижение</li>
        <li>Второе достижение</li>
        <li>Третье достижение</li>
    </ul>

    <h2>Мои фото</h2>
    <!-- Чтобы вставить картинку в статью, загрузите её и вставьте код ниже -->
    <img src="bg.jpg" alt="Описание фото" style="width: 100%; border-radius: 10px; margin-bottom: 10px;">
    
    <h2>Контакты</h2>
    <p>Вконтакте / Telegram / Почта: <b>ваш_ник</b></p>
</div>

</body>
</html>
